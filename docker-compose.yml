version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-veritras}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-veritras}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-veritras} -d ${POSTGRES_DB:-veritras}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://veritras:changeme@postgres:5432/veritras}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SEPOLIA_RPC_URL: ${SEPOLIA_RPC_URL:-}
      PRODUCT_REGISTRY_CONTRACT: ${PRODUCT_REGISTRY_CONTRACT:-}
      SHIPMENT_TRACKER_CONTRACT: ${SHIPMENT_TRACKER_CONTRACT:-}
      INDEXER_POLL_INTERVAL: ${INDEXER_POLL_INTERVAL:-15}
      INDEXER_START_BLOCK: ${INDEXER_START_BLOCK:-0}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    depends_on:
      - backend

  blockchain:
    build:
      context: ./blockchain
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8545:8545"

volumes:
  postgres_data:
